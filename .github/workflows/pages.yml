name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest assets icons .nojekyll _site/
          # Version du cache = commit : les appareils se mettent à jour automatiquement
          sed -i "s/const VERSION = \"[^\"]*\";/const VERSION = \"${GITHUB_SHA::8}\";/" _site/sw.js
          grep "const VERSION" _site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
